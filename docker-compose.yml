services:
  # -------------------------------------------------------------------------
  # Service 1: Database
  # -------------------------------------------------------------------------
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MAUTIC_DB_DATABASE:-mautic}
      MARIADB_USER: ${MAUTIC_DB_USER:-mautic}
      MARIADB_PASSWORD: ${MAUTIC_DB_PASSWORD:-mauticpassword}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Service 2: Mautic Web (The Leader)
  # -------------------------------------------------------------------------
  mautic:
    build: .
    image: mautic7-mautic:local
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_web
      - DOCKER_MAUTIC_RUN_MIGRATIONS=true
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mariadb}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASSWORD:-mauticpassword}
      - MAUTIC_URL=${MAUTIC_URL:-http://localhost:8080}
      - MAUTIC_TRUSTED_PROXIES=${MAUTIC_TRUSTED_PROXIES:-[]}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
    volumes:
      - mautic_data:/var/www/html
    # AUTOMATION FIX 1: Force permissions to be correct on every start
    entrypoint: ["/bin/sh", "-c", "chown -R www-data:www-data /var/www/html && /entrypoint.sh apache2-foreground"]
    # AUTOMATION FIX 2: Check if the CONFIG FILE exists. If not, report 'unhealthy'.
    # This signals the other containers to keep waiting.
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/config/local.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s # Give you 5 mins to run the installer before marking failed

  # -------------------------------------------------------------------------
  # Service 3: Mautic Cron (Waits for Install)
  # -------------------------------------------------------------------------
  mautic-cron:
    build: .
    image: mautic7-mautic:local
    restart: unless-stopped
    depends_on:
      mautic:
        condition: service_healthy # AUTOMATION FIX 3: Do not start until config file exists
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_cron
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mariadb}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASSWORD:-mauticpassword}
      - MAUTIC_URL=${MAUTIC_URL:-http://localhost:8080}
      - MAUTIC_TRUSTED_PROXIES=${MAUTIC_TRUSTED_PROXIES:-[]}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
    volumes:
      - mautic_data:/var/www/html

  # -------------------------------------------------------------------------
  # Service 4: Mautic Worker (Waits for Install)
  # -------------------------------------------------------------------------
  mautic-worker:
    build: .
    image: mautic7-mautic:local
    restart: unless-stopped
    depends_on:
      mautic:
        condition: service_healthy # AUTOMATION FIX 3: Do not start until config file exists
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_worker
      - DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL=2
      - DOCKER_MAUTIC_WORKERS_CONSUME_HIT=2
      - DOCKER_MAUTIC_WORKERS_CONSUME_FAILED=2
      - MAUTIC_DB_HOST=${MAUTIC_DB_HOST:-mariadb}
      - MAUTIC_DB_PORT=${MAUTIC_DB_PORT:-3306}
      - MAUTIC_DB_DATABASE=${MAUTIC_DB_DATABASE:-mautic}
      - MAUTIC_DB_USER=${MAUTIC_DB_USER:-mautic}
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASSWORD:-mauticpassword}
      - MAUTIC_URL=${MAUTIC_URL:-http://localhost:8080}
      - MAUTIC_TRUSTED_PROXIES=${MAUTIC_TRUSTED_PROXIES:-[]}
      - PHP_INI_DATE_TIMEZONE=${PHP_INI_DATE_TIMEZONE:-UTC}
    volumes:
      - mautic_data:/var/www/html

  # -------------------------------------------------------------------------
  # Service 5: phpMyAdmin
  # -------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  mariadb_data:
  mautic_data:
